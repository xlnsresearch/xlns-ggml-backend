name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: |
            Thanks for opening your first issue here! If it is about a build or a wrong result, please include the backend (LNS16, LNS32, LNSCUDA16 or LNSCUDA32), the summation mode, the model and the exact command you ran, so we can reproduce it.
          pr_message: |
            Thanks for your first pull request! Please have a look at [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md) if you haven't yet. CI builds the backends and runs the unit tests for every summation mode; a maintainer will review once it is green.
