name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,in-progress,help wanted,good first issue
          exempt-pr-labels: pinned,in-progress
          exempt-all-milestones: true
          exempt-draft-pr: true
          stale-issue-message: >
            This issue has had no activity for 60 days, so it has been marked as stale.
            It will be closed in 14 days unless there is new activity. If it is still
            relevant, leave a comment or add the `pinned` label.
          stale-pr-message: >
            This pull request has had no activity for 60 days, so it has been marked as
            stale. It will be closed in 14 days unless there is new activity. If you are
            still working on it, push a commit, leave a comment, or add the `in-progress` label.
          close-issue-message: >
            Closing this issue because it has been stale for 14 days. Feel free to reopen
            it if it is still relevant.
          close-pr-message: >
            Closing this pull request because it has been stale for 14 days. Feel free to
            reopen it when you pick it up again.
